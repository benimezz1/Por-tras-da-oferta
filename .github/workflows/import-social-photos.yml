name: Importar fotos do feed

on:
  push:
    paths:
      - '.github/workflows/import-social-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Ler repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar conversor de imagens
        run: python -m pip install 'Pillow>=10,<13'
      - name: Baixar e otimizar fotografias diferentes
        run: python tools/download_social_photos.py
      - name: Salvar fotos locais no GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/social/unique/
          if git diff --cached --quiet; then
            echo "Fotografias já estão presentes."
          else
            git commit -m "assets: adiciona fotografias independentes dos 12 posts, 12 stories e perfis"
            git push
          fi
