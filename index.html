.preview-avatar { overflow:hidden; }
/* Fotografia inteira: sem cortar rostos para encaixar na geometria do feed.
   Uma camada desfocada utiliza a mesma imagem como fundo editorial. */
.post-media > .art.has-photo { height:auto; aspect-ratio:1 / 1; }
.art.has-photo::before {
 content:""; position:absolute; inset:-12%; z-index:0; pointer-events:none;
 background-image:var(--art-photo-bg); background-size:cover; background-position:center;
 filter:blur(28px) brightness(.72) saturate(.85); transform:scale(1.02);
}
.art.has-photo .art-photo { position:relative; z-index:1; width:100%; height:100%; object-fit:contain; }
.art.has-photo .art-photo-overlay { z-index:2; }
.art.has-photo .art-brand-label { z-index:3; color:#fff; text-shadow:0 2px 8px #0009; }
.story-picture>.art.has-photo { width:100%; height:100%; }
.story-picture>.art.has-photo .art-photo { object-fit:contain; }
.product-hero>.art.has-photo { height:100%; }
.product-hero>.art.has-photo .art-photo { object-fit:contain; }
.cart-thumb>.art.has-photo { height:100%; width:100%; }
.cart-thumb>.art.has-photo .art-photo { object-fit:contain; }
.preview-photo.realistic-preview img { object-fit:cover; }

/* Story avatar layout: fixed circular frames, independent of photo proportions. */
.story{position:relative;flex:0 0 66px;width:66px;min-width:66px;max-width:66px}
.story-ring{box-sizing:border-box;width:60px;height:60px;flex:0 0 60px;display:flex;align-items:center;justify-content:center;padding:3px;overflow:hidden}
.story-face{box-sizing:border-box;position:relative;display:block;flex:0 0 54px;width:54px;height:54px;min-width:54px;min-height:54px;border:3px solid #fff;border-radius:50%;overflow:hidden}
.story-face>img.avatar-photo{position:absolute;inset:0;display:block;width:100%;height:100%;min-width:0;min-height:0;max-width:none;max-height:none;object-fit:cover;object-position:center 35%;border-radius:50%}
.story-name{position:relative;z-index:1;display:block;flex:0 0 auto;width:66px;max-width:66px;min-height:14px;font-size:11px;line-height:14px;text-align:center;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}

/* Fila unica: contas de amigos e paginas sempre lado a lado. */
.story-rail{padding:16px 0 7px;border-bottom:1px solid #f1edf0}
.story-rail-heading{padding:0 14px;font-size:10px;line-height:14px;letter-spacing:.14em;font-weight:800;color:#9e91a0}
.story-rail-heading span{font-size:10px;color:#ad9aaa;font-weight:500;letter-spacing:0;text-transform:none;margin-left:7px}
.story-rail .stories{display:flex;flex-wrap:nowrap;gap:14px;overflow-x:auto;overflow-y:hidden;padding:13px 14px 5px;align-items:flex-start}
.story-rail .story{flex:0 0 66px;min-width:66px;max-width:66px}
.story-rail .story-ring{flex-shrink:0}
.page-logo{position:absolute;inset:0;display:block;overflow:hidden;border-radius:50%;background:#fff}
.page-logo svg{display:block;width:100%;height:100%;border-radius:50%}
.photo-avatar,.story-face{position:relative}
.photo-avatar>.page-logo{border-radius:50%}
.story-rail .story-name{font-size:10px}
.story.read .story-ring{background:#e8e3e9}

/* Acesso de retorno presente durante toda a partida, inclusive sobre stories. */
#exit-home-trigger{position:fixed;z-index:1000;top:max(16px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));display:inline-flex;align-items:center;gap:8px;padding:10px 15px;background:rgba(39,36,45,.92);border:1px solid rgba(255,255,255,.5);border-radius:999px;color:#fff;font-size:13px;font-weight:800;box-shadow:0 10px 26px rgba(35,24,42,.17);backdrop-filter:blur(8px)}
#exit-home-trigger:hover{background:#523b60}
#exit-home-trigger[hidden],#exit-confirm[hidden]{display:none!important}
#exit-confirm{position:fixed;inset:0;z-index:1001;display:grid;place-items:center;padding:18px;background:rgba(26,18,32,.64);backdrop-filter:blur(5px)}
.exit-confirm-card{width:min(100%,410px);background:#fffafd;color:#27242d;border:1px solid #f1e7ef;border-radius:24px;padding:28px;box-shadow:0 22px 64px rgba(19,12,25,.28)}
.exit-confirm-card h2{font-size:clamp(24px,4vw,30px);letter-spacing:-.04em;margin:12px 0 12px;line-height:1.15}
.exit-confirm-card p{font-size:14px;line-height:1.6;color:#746878;margin-bottom:24px}
.exit-confirm-actions{display:flex;gap:10px}
.exit-confirm-actions button{flex:1;border:0;border-radius:13px;padding:13px 12px;font-size:13px;font-weight:800}
#exit-cancel{background:#f1ebf0;color:#27242d}
#exit-cancel:hover{background:#e8dfe9}
#exit-accept{background:#27242d;color:white}
#exit-accept:hover{background:#543c64}
@media(max-width:810px){#exit-home-trigger{top:auto;left:max(12px,env(safe-area-inset-left));bottom:max(68px,calc(env(safe-area-inset-bottom) + 68px));font-size:12px;padding:9px 12px}}
@media(max-width:420px){.exit-confirm-card{padding:23px}.exit-confirm-actions{flex-direction:column-reverse}}

/* Recomendação explicável: posts, anúncios e controle pelo participante. */
.algorithm-button{display:inline-flex;align-items:center;gap:5px;border:1px solid #eee3eb;background:#fff9fd;border-radius:12px;padding:6px 8px;color:#765476;font-weight:800;font-size:11px}
.algorithm-button .ico{width:17px;height:17px}.algorithm-button:hover,.why-post:hover{background:#f6e7f4}
.feed-recommendation-heading{margin:10px 13px 3px;display:flex;align-items:center;gap:8px;color:#817282;font-size:11px;font-weight:800}
.feed-recommendation-heading>span:nth-child(2){color:#d8bbd1}
.recommendation-caption{padding:6px 14px 15px;color:#a08ea0;font-size:11px}
.recommendation-caption button{border:0;background:none;color:#9e5388;font-size:11px;text-decoration:underline;cursor:pointer;font-weight:800}
.why-post{display:block;margin:0 14px 16px;border:0;background:#fbf5fa;border-radius:10px;padding:8px 11px;text-align:left;color:#805579;font-size:11px;font-weight:800}
.algorithm-panel{padding:22px 18px 35px}.algorithm-panel h2{font-size:26px;letter-spacing:-.05em;margin:8px 0 10px}
.algorithm-panel h3{font-size:15px;margin:20px 0 12px}.algorithm-panel>p{font-size:12px;line-height:1.6;color:#867889}
.algo-summary{display:flex;gap:8px}.algo-summary>span{flex:1;padding:12px;border:1px solid #efe7ee;border-radius:12px;color:#877c86;font-size:11px}
.algo-summary strong{display:block;font-size:18px;color:#322836}.algo-topic{margin:12px 0}
.algo-topic>div:first-child{display:flex;justify-content:space-between;font-size:11px;color:#6c5c6d;gap:8px}.algo-topic strong{font-size:12px}
.algo-track{height:8px;background:#f0e8ef;border-radius:99px;overflow:hidden;margin-top:6px}
.algo-track>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ec477e,#a372dc)}
.algo-steps{padding:15px;border:1px solid #e8dbe9;background:#fcf7fc;border-radius:14px;font-size:12px;line-height:1.6}
.algo-steps ol{padding-left:20px;margin:9px 0 0}.algorithm-clear{width:100%;font-size:12px}
.algorithm-explanation>p{font-size:12px;color:#756878;line-height:1.6}
.algo-score{display:flex;justify-content:space-between;align-items:center;border:1px solid #ebdcec;padding:13px;border-radius:12px;background:#fcf5fc}
.algo-score span{font-size:12px;color:#79617b}.algo-score strong{font-size:27px;color:#804c9f}
.algo-factors{padding:0;list-style:none;margin:14px 0}.algo-factors li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #f2e9f1;padding:9px 3px;font-size:12px}
.algo-factors li strong{font-variant-numeric:tabular-nums}
@media(max-width:420px){.algorithm-button{padding:5px 7px}.algorithm-button span{display:none}.feed-recommendation-heading{font-size:10px}}

/* Feed continuo: o objetivo e apresentado antes, mas nao aparece a cada scroll. */
.critical-panel{padding:23px 19px 35px}.critical-panel h2{font-size:28px;line-height:1.12;letter-spacing:-.045em;margin:10px 0 12px}
.critical-panel>p{font-size:13px;color:#786d7a;line-height:1.65}.goal-numbers{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0}
.goal-numbers>div{border-radius:13px;background:#faf3fa;border:1px solid #f2e4f1;padding:14px;min-width:0}
.goal-numbers small{display:block;font-size:10px;color:#988297}.goal-numbers strong{font-size:21px;display:block;margin-top:5px;letter-spacing:-.04em}
.goal-result{background:#fff8f1;border:1px solid #f0e0ca;border-radius:13px;padding:17px;font-size:13px}
.goal-result.ok{background:#f5faf4;border-color:#d8e9d3}.goal-result strong{display:block;margin-bottom:5px}
.goal-result p{font-size:12px;margin:0;color:#766c73}.critical-action{width:100%;margin:9px 0 0;font-size:13px}
.coach-questions{border:1px solid #efe1ed;border-radius:15px;padding:17px;margin:17px 0;font-size:13px;line-height:1.7}
.coach-questions h3{font-size:15px}.coach-questions ol{padding-left:20px;margin:8px 0}
.feed-rail-title{font-weight:850;font-size:20px;letter-spacing:-.04em;margin:12px 0 8px}
.side-action{margin-top:15px;font-size:12px;padding:10px 11px}
.feed-end-hint{margin:18px 14px;padding:19px;border-radius:16px;background:#faf3f9;border:1px solid #ecdce9;color:#5b495f;font-size:13px}
.feed-end-hint p{font-size:12px;margin:6px 0 0}.load-more{margin:15px 14px;width:calc(100% - 28px);background:#faf6fa;color:#684768;border:1px solid #e6d9e6;border-radius:13px;padding:14px;font-size:13px;font-weight:800}
.finish-feed{display:block;margin:15px 14px 12px;width:calc(100% - 28px);border:0;border-radius:14px;background:#2b2230;color:white;padding:17px;font-weight:850;font-size:14px}
.feed-footer-note{text-align:center;color:#ad9bab;font-size:11px;margin:0 12px 25px}
.intro-secondary{display:block;margin:16px auto;color:#efdeea}
@media(max-width:810px){.game .rail{display:none}}

/* Story sequencial: indicadores, toque lateral, pausa, swipe e teclas. */
.story-progress-row{position:absolute;z-index:5;top:9px;left:12px;right:12px;display:flex;gap:3px;height:3px;pointer-events:none}
.story-progress-segment{min-width:0;flex:1;background:rgba(255,255,255,.34);overflow:hidden;border-radius:10px}
.story-progress-fill{display:block;height:100%;width:0;background:#fff;border-radius:inherit}
.story-progress-fill.completed{width:100%}
.story-progress-fill.current{animation:story-playback var(--story-duration,5.5s) linear forwards}
.story-layer.is-paused .story-progress-fill.current{animation-play-state:paused}
@keyframes story-playback{from{width:0}to{width:100%}}
.story-layer .story-top{top:18px;z-index:5;height:57px;padding-top:6px;gap:9px}
.story-layer .story-user{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story-layer .story-type{white-space:nowrap}
.story-layer .story-pause{border:0;border-radius:50%;width:31px;height:31px;flex:none;background:#ffffff1f;color:#fff;font-weight:900;display:grid;place-items:center}
.story-layer .story-pause:hover,.story-layer .story-close:hover{background:#ffffff44}
.story-layer .story-picture{pointer-events:none}
.story-layer .story-tap-zone{position:absolute;top:75px;bottom:0;border:0;background:transparent;z-index:2;cursor:pointer;padding:0;outline-offset:-5px}
.story-layer .story-tap-zone.previous{left:0;width:35%}
.story-layer .story-tap-zone.next{right:0;width:65%}
.story-layer .story-tap-zone:focus-visible{outline:2px solid #fff9;outline-offset:-3px}
.story-layer .story-caption{pointer-events:none;z-index:3}
.story-layer .story-guidance{position:absolute;z-index:3;bottom:22px;left:12px;right:12px;text-align:center;color:#ebdfefff;font-size:11px;pointer-events:none;text-shadow:0 1px 6px #0009}
.story-layer.is-paused .story-guidance::before{content:"⏸ Story pausado · "}
.story-layer{touch-action:pan-y}
@media(prefers-reduced-motion:reduce){.story-progress-fill.current{animation:none;width:100%}}
/* O algoritmo e explicado somente na tela de conclusao. */
.algorithm-final-reveal{display:block;margin:18px 0 8px;width:100%;text-align:left;line-height:1.45}
.algorithm-final[hidden]{display:none!important}
.algorithm-final{scroll-margin-top:22px}
.algorithm-final h3{margin-bottom:10px}
.algorithm-final .algorithm-panel{padding:8px 0 0}
.algorithm-final .algo-summary{margin:14px 0 18px}
.algorithm-final .algo-summary>span{background:#fcf8fc}
.algorithm-final .algo-topic{margin:14px 0}
.algorithm-final .algo-steps{margin-top:16px}
.algorithm-final .algo-disclaimer{color:#857688;font-size:12px;line-height:1.6;margin:16px 0 4px}

/* Fotos pre-carregadas e transicao sem tela vazia. Cada autor possui barra propria. */
.story-layer{background:#1f1b24;animation:none;isolation:isolate}
.story-layer .story-picture{position:relative;display:block;overflow:hidden;background:#1f1b24;min-height:100%}
.story-layer .story-picture::before{content:"";position:absolute;inset:-25px;background-image:var(--story-bg);background-size:cover;background-position:center;filter:blur(22px) brightness(.55);transform:scale(1.1);z-index:0}
.story-layer .story-photo{position:absolute;inset:0;z-index:1;display:block;width:100%;height:100%;object-fit:contain;object-position:center;animation:story-photo-in .10s ease both}
.story-layer .story-photo-fallback{position:absolute;inset:0;background:linear-gradient(135deg,#34283f,#1f202d)}
@keyframes story-photo-in{from{opacity:.92}to{opacity:1}}
.story-layer .story-top{padding-top:13px;height:72px;top:9px;background:linear-gradient(180deg,rgba(8,6,12,.72),rgba(8,6,12,.36) 66%,transparent);align-items:center}
.story-layer .story-owner-avatar{box-sizing:border-box;border:2px solid rgba(255,255,255,.9);width:37px;height:37px;flex-shrink:0}
.story-layer .story-user{display:flex;flex:1;min-width:0;flex-direction:column;gap:3px;line-height:1.12;white-space:normal;overflow:hidden;color:white;text-shadow:0 1px 3px rgba(0,0,0,.75)}
.story-layer .story-user strong{font-size:13px;font-weight:850;line-height:1.2;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story-layer .story-user small{font-size:10px;font-weight:500;opacity:.9;color:#f6eef7}
.story-layer .story-type{margin-left:0;font-size:9px;padding:4px 7px;background:rgba(12,8,16,.38)}
.story-layer .story-caption{z-index:4;bottom:68px;background:rgba(21,16,27,.80);box-shadow:0 5px 24px rgba(0,0,0,.16);backdrop-filter:blur(5px)}
.story-layer .story-guidance{z-index:4;bottom:22px;text-shadow:0 1px 7px #000}
.story-layer .story-progress-row{z-index:7;top:10px}
.story-layer .story-tap-zone{top:82px;bottom:0}

/* Curtida como em redes sociais: dois toques na foto, coração completamente preenchido. */
.feed-photo{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.feed-photo img{-webkit-user-drag:none;user-select:none}
.like-button.is-liked{color:#ec477e}
.like-button.is-liked .ico,.ico.heart-filled{fill:currentColor!important;stroke:currentColor!important}
.photo-like-burst{pointer-events:none;position:absolute;inset:0;z-index:8;display:grid;place-items:center;animation:photo-heart-burst .65s ease-out forwards}
.photo-like-burst .ico{width:min(25%,115px);height:auto;fill:white!important;stroke:white!important;stroke-width:1.4;filter:drop-shadow(0 3px 16px rgba(35,19,35,.48))}

function mediaPhoto(kind,cssClass,alt){
 const src=mediaSrc(kind),id=originalPhotoSources[kind],local=mediaAssets[photoFallbackKeys[kind]||'friends_park'];
 const remote=id?`https://images.pexels.com/photos/${id}/pexels-photo-${id}.jpeg?auto=compress&cs=tinysrgb&w=1000`:'';
 const recovery=id?` onerror="if(!this.dataset.remote){this.dataset.remote='yes';this.src='${remote}';}else{this.onerror=null;this.src='${local}';}"`:'';
 return `<img class="${cssClass}" src="${src}" alt="${esc(alt)}" loading="lazy" decoding="async"${recovery}/>`;
}

function storyGroups(){
 const ranked=Recommender.rankStories(storyPool(),recommendationOptions());
 const authors=new Map();
 for(const item of ranked){
  if(item.day!==state.day)continue;
  if(!authors.has(item.user))authors.set(item.user,{user:item.user,source:item.source,items:[]});
  authors.get(item.user).items.push(item);
 }
 return [...authors.values()].map(group=>({...group,items:group.items.sort((a,b)=>a.idx-b.idx)}))
 .sort((a,b)=>a.user==='você'?-1:b.user==='você'?1:0);
}
function renderStories(){
 const groups=storyGroups(),own=groups.find(g=>g.user==='você');
 const ownFirst=own?.items?.[0],hasOwn=!!ownFirst;
 const latest=state.myStories.filter(x=>x.day===state.day).at(-1);
 const ownPhoto=latest?mediaPhoto(latest.photo,'avatar-photo','Foto do seu story'):'<span aria-hidden="true">🙂</span>';
 const mySlot='<span class="own-story-container"><button class="story own-story-slot '+(hasOwn?'has-story':'')+'" data-action="'+(hasOwn?'story':'new-story')+'"'+(hasOwn?' data-index="'+ownFirst.idx+'"':'')+' data-story-user="você" aria-label="'+(hasOwn?'Ver seu story':'Criar seu story')+'"><span class="story-ring"><span class="story-face">'+ownPhoto+'</span></span><span class="story-name">Seu story</span></button>'+(hasOwn?'<button class="own-story-new" data-action="new-story" aria-label="Adicionar novo story">+</button>':'')+'</span>';
 return '<section class="story-rail" aria-label="Stories de amigos e páginas"><div class="story-rail-heading">STORIES <span>Amigos, criadores e páginas</span></div><div class="stories">'+mySlot+groups.filter(g=>g.user!=='você').map(group=>{

  const fullyRead=group.items.every(s=>state.stories.includes('story-'+s.idx));
  const page=group.source==='page';
  return '<button class="story '+(page?'page-story':'')+' '+(fullyRead?'read':'')+'" data-action="story" data-index="'+first.idx+'" data-story-user="'+esc(group.user)+'" aria-label="Ver '+group.items.length+' story'+(group.items.length===1?'':'s')+' de '+esc(group.user)+'"><span class="story-ring"><span class="story-face">'+profileAvatar(group.user,first.photo,page)+'</span></span><span class="story-name">'+esc(group.user)+'</span></button>';

}

function shopPicks(){
 const purchased=new Set(state.purchases.map(x=>x.id));
 return Recommender.topics.filter(x=>!purchased.has(x))
   .sort((a,b)=>{
    const relevance=id=>Recommender.affinity(state.algorithm,id,state.phase)
      +(state.cart.includes(id)?3:0)+(state.viewed.includes(id)?1:0)
      +Recommender.complementaryScore(id,state.purchases.map(p=>p.id))*7;
    return relevance(b)-relevance(a)||Recommender.topics.indexOf(a)-Recommender.topics.indexOf(b);
   }).slice(0,2);
}

function setupFeedAssist(){
 const scroller=document.querySelector('#feed-scroll'),cue=document.querySelector('.scroll-cue');
 if(!scroller)return;
 const sync=()=>{
  const remaining=scroller.scrollHeight-scroller.clientHeight-scroller.scrollTop;
  if(cue)cue.classList.toggle('hidden',scroller.scrollTop>88||remaining<120);
  if(scroller.scrollTop<120||remaining>190||loadPending||refreshing||overlay||story||modal||!exitConfirm.hidden||document.querySelector('.sleep-reminder,.tag-vibe-overlay'))return;
  if(dayItems().some(x=>x.kind==='night')||state.wake)return;
  loadPending=true;
  requestAnimationFrame(()=>{
   loadPending=false;
   if(!document.contains(scroller)||overlay||story||modal||!exitConfirm.hidden||document.querySelector('.sleep-reminder,.tag-vibe-overlay'))return;
   if(appendNext())renderGame(true);
  });
 };
 sync();scroller.addEventListener('scroll',sync,{passive:true});
}

 // Uma foto com marcacao de amigo aparece naturalmente no feed da noite:
 // Bia na segunda e Gabi na sexta, sem repetir a mesma postagem a cada dia.
 if(!state.wake&&TAGGED_EVENTS[state.day]&&!state.feedItems.some(x=>x.id===TAGGED_EVENTS[state.day].id)){
   topOfToday([{kind:'event',type:'tagged',id:TAGGED_EVENTS[state.day].id,day:state.day}]);

 }
 const y=keepScroll?document.querySelector('#feed-scroll')?.scrollTop||0:0;
 root.innerHTML=stageFeed();

 if(overlay)drawOverlay();if(modal)drawModal();if(story)drawStory();
 // Assim que abrir o feed com uma foto marcada, mostrar o bônus social uma vez.
 if(!overlay&&!modal&&!story&&!state.wake){
  const tagged=TAGGED_EVENTS[state.day],phone=document.querySelector('.phone');
  if(tagged&&!state.taggedVibeSeen.includes(tagged.id))
   setTimeout(()=>{

function algorithmResults(){
 const summary=Recommender.summary(state.algorithm,state.phase);
 const visualTopics=FeedRanker.summarize(state.algorithm,catalogIndex(),state.phase);
 const ads=state.feedItems.filter(item=>item.kind==="ad");
 const posts=state.feedItems.filter(item=>item.kind==="post");
 const retargets=ads.filter(item=>item.campaign==="retarget").length;
 const complementary=ads.filter(item=>item.campaign==="pair").length;
 const explored=ads.filter(item=>item.campaign==="prospecting").length;
 const entries=Recommender.topics.map(topic=>{
  const points=summary.affinities[topic];
  const percent=Math.min(100,Math.max(4,Math.round((points+11)/28*100)));
  const tendency=points>1?"Sinal de interesse":points<-1?"Menos interesse":"Poucos sinais";
  return `<div class="algo-topic"><div><strong>${Recommender.labels[topic]}</strong><span>${tendency} · ${points.toFixed(1)} pts</span></div><div class="algo-track"><span style="width:${percent}%"></span></div></div>`;
 }).join("");
 return `<section class="end-box algorithm-final" id="algorithm-final-panel" hidden>
  <h3>O que aconteceu por trás do seu feed?</h3>
  <div class="algorithm-panel">
   <p>O jogo registrou apenas suas interações fictícias e usou esses sinais para escolher quais conteúdos mostrar a seguir. <strong>A rede não recebeu sua meta de poupar R$ 400.</strong></p>
   <div class="algo-summary"><span><strong>${summary.events}</strong> sinais de interação</span><span><strong>${posts.length}</strong> posts apresentados</span><span><strong>${ads.length}</strong> anúncios fictícios</span></div>
   <p class="small muted">Das mensagens comerciais, ${explored} apresentaram novas ofertas, ${retargets} retomaram produtos de interesse e ${complementary} sugeriram produtos relacionados a compras anteriores.</p>
   <h3>Interesses que a simulação inferiu</h3>
   ${entries}
   <p class="small muted">Pontuações ilustrativas, não percentuais de consumo. Um tema mais pontuado pode aparecer mais vezes porque você o curtiu, visualizou, salvou ou pesquisou.</p>
   <h3>Fotos e assuntos que você demonstrou gostar</h3>
   <p class="small muted">${visualTopics.length?visualTopics.map(x=>esc(x.label)).join(' · '):'Ainda não houve curtidas suficientes para inferir preferências visuais.'} Essas preferências vêm dos assuntos e tags das fotos, nunca de reconhecimento facial.</p>
   <div class="algo-steps"><strong>Como a recomendação se formou</strong>
    <ol>
     <li>O sistema escolheu conteúdos de amigos, páginas e marcas entre vários assuntos.</li>
     <li>Seus likes, stories vistos, comentários, visitas e produtos salvos alteraram os pesos dos temas.</li>
     <li>A ordem dos próximos posts considerou afinidade, popularidade fictícia e variedade; os anteriores permaneceram onde já estavam.</li>
     <li>Posts e anúncios foram classificados por relevância, autor, contexto, novidade e penalidades por repetição. Os próximos lotes mudaram, mas os anteriores não foram reorganizados.</li>
     <li>O sistema abriu novos temas conforme você rolava e misturou oito interesses comerciais ao feed sem capítulos visíveis.</li>
     <li>Os anúncios usaram três abordagens: novidade, retorno de interesses anteriores e itens complementares após compras. Nenhum produto já comprado voltou como anúncio.</li>
     <li>Curiosidade não é intenção certa de comprar: comentários, visitas e curtidas geraram sinais de peso diferente, que perderam força ao longo do percurso.</li>
     <li>A escolha de guardar R$ 400 nunca entrou no ranking: o jogo contrapõe um objetivo pessoal a recomendações comerciais, sem forçar uma compra.</li>
    </ol>
   </div>
   <p class="algo-disclaimer">Este é um modelo educativo e explicável criado para o projeto, não uma reprodução dos sistemas proprietários do Instagram nem um diagnóstico de comportamento. Os dados ficam neste navegador.</p>
  </div>
 </section>`;
}

/* Rolar ate o gatilho dispara o popup. Cada recompensa so abre uma vez. */
function setupRewardCelebrations(){
 const scroll=document.querySelector('#feed-scroll');if(!scroll)return;
 const check=()=>{
  if(document.visibilityState!=='visible'||overlay||modal||story||!exitConfirm.hidden||
     document.querySelector('.reward-celebration,.tag-vibe-overlay,.sleep-reminder,.feed-refresh-loading'))return;
  const bounds=scroll.getBoundingClientRect(),cutoff=bounds.top+scroll.clientHeight*.72;
  for(const el of scroll.querySelectorAll('.reward-trigger[data-surprise-id]')){
   const id=el.dataset.surpriseId,r=el.getBoundingClientRect();
   if(state.rewardSeen.includes(id)||r.top>cutoff||r.bottom<bounds.top-24)continue;
   const item=state.feedItems.find(x=>x.id===id&&x.type==='surprise');
   if(!item)continue;
   if(showRewardCelebration(item)){state.rewardSeen.push(id);save();break;}
  }
 };
 scroll.addEventListener('scroll',check,{passive:true});
 requestAnimationFrame(check);
}
function claimSurprise(item){
 /* Eventos anteriores nao possuem rewardPending: ja foram pagos na insercao. */
 if(!item.rewardPending)return;
 item.rewardPending=false;
 if(item.variant==='coins')state.coins=Pressure.round(state.coins+(item.bonus||3));
 else if(item.variant==='comment')Pressure.vibeChange(state.vibe,4,'surprise','A Bia comentou numa foto sua.');
 else if(item.variant==='drop'&&item.product)addCoupon({code:'VOLTA-'+item.product.toUpperCase(),label:'15% OFF no '+productName(item.product),kind:'pct',amount:15,min:0,only:[item.product],expiresDay:item.day,source:'surprise'});
}
function showRewardCelebration(item){
 const phone=document.querySelector('.phone');
 if(!phone||phone.querySelector('.reward-celebration,.tag-vibe-overlay,.sleep-reminder'))return false;

function setupFeedExposure() {
  if (feedObserver) feedObserver.disconnect();
  for (const t of impressionTimers.values()) clearTimeout(t);
  impressionTimers.clear();
  const scroll=document.querySelector("#feed-scroll");
  if (!scroll || !("IntersectionObserver" in window)) return;
  feedObserver=new IntersectionObserver(entries => {
    for (const entry of entries) {
      const el=entry.target, id=el.dataset.recId;
      if (!id) continue;
      if (!entry.isIntersecting || entry.intersectionRatio < 0.2) {
        if (impressionTimers.has(el)) { clearTimeout(impressionTimers.get(el)); impressionTimers.delete(el); }
        continue;
      }
      // Relogio simulado avanca quando um post entra em cena, mesmo com rolagem rapida.
      // O algoritmo ainda aguarda permanencia antes de registrar interesse.
      if(document.visibilityState==='visible'&&!overlay&&!story&&!modal&&exitConfirm.hidden&&!document.querySelector('.sleep-reminder,.tag-vibe-overlay'))
        advanceClockForVisible(id);
      if (impressionTimers.has(el)) continue;
      impressionTimers.set(el,setTimeout(() => {
        impressionTimers.delete(el);
        if (!el.isConnected || document.visibilityState!=="visible" || overlay || modal || story || !exitConfirm.hidden) return;
        if(!state.personalized){feedObserver?.unobserve(el);return;}
        const topic=el.dataset.recTopic, author=el.dataset.recAuthor||"";
        if (!topic) return;
        trackModel("impression",topic,id,author);
        trackModel("dwell",topic,id,author);
        feedObserver?.unobserve(el);
      },1350));
    }
  },{root:scroll,threshold:[0,0.2,0.45]});
  scroll.querySelectorAll("[data-rec-id]").forEach(el=>feedObserver.observe(el));
}

 const next=Math.max(0,position),seq=++storyChangeSeq;

/* ---------- notificação no topo do celular ---------- */
let bannerQueue=[],bannerTimer=null,bannerShown=null;
function banner(html,attrs={}){bannerQueue.push({html,attrs});if(!bannerTimer)setTimeout(nextBanner,450);}
function nextBanner(){
 const phone=document.querySelector('.phone');
 if(!bannerQueue.length||!phone||story){bannerTimer=null;return;}
 const item=bannerQueue.shift();
 phone.querySelector('.push-banner')?.remove();
 const b=document.createElement('button');b.type='button';b.className='push-banner';b.innerHTML=item.html;

/* ---------- eventos do roteiro dentro do feed ---------- */
function eventApplies(ev){
 if(ev.type==='card')return !state.card.active;
 if(ev.type==='cartnudge')return state.cart.length>0||state.viewed.some(id=>!bought(id));
 if(ev.type==='trial')return !bought('plano');
 if(ev.type==='lastcall')return !bought('ingresso');
 return true;
}
function onEventInserted(item){
 const d=item.day;
 if(item.type==='surprise'){
  if(item.variant==='coins')item.bonus=3;
  if(item.variant!=='nothing')item.rewardPending=true;
  expose('recompensa_variavel',item.variant==='nothing'?'A tentativa de surpresa nao gerou bonus, sem aviso visivel no feed.':'Uma recompensa variable foi preparada para ser revelada somente durante a rolagem.');
  return;
 }
 if(item.type==='checkin'){
  state.streak++;const bonus=state.streak>=5?15:5;state.coins=Pressure.round(state.coins+bonus);item.bonus=bonus;
  expose('recompensa',`Check-in diário: sequência de ${state.streak} dia(s) e +${money(bonus)} em moedas que só valem no app.`);
 }else if(item.type==='chat')deliverThread(item.thread,d);
 else if(item.type==='compare'){const c=Week.COMPARE_POSTS[item.post];if(c){Pressure.vibeChange(state.vibe,c.vibe,'compare',c.moment);for(const k of c.strategies)expose(k,c.moment);}}
 else if(item.type==='mood'){
  expose('emocao',state.vibe.value<55?`Às 23h, com sua vibe em ${Math.round(state.vibe.value)}, apareceu “Dia puxado? Você merece um mimo”.`:'Antes de dormir, o feed ofereceu “um presentinho pra você”.');
  expose('personalizacao','O anúncio da noite escolheu produtos baratos ligados ao que você viu.');
  addCoupon({code:'MIMO',label:'Frete grátis hoje',kind:'value',amount:0,freeShipping:true,min:0,expiresDay:d,source:'mood'});
 }else if(item.type==='flash'){
  state.flags.saleEnd=state.flags.saleEnd||Date.now()+(47*3600+59*60+50)*1000;
  expose('preco','Mega Liquida: os preços “de” ficaram mais altos do que no começo da semana.');
  expose('urgencia','Mega Liquida com contagem regressiva de 48 horas.');
 }else if(item.type==='lastcall'){
  state.flags.festEnd=state.flags.festEnd||Date.now()+(1*3600+42*60)*1000;
  expose('escassez','Pocket Fest: “lote final, 92% vendido”.');expose('fomo','Pocket Fest: “a turma toda vai”.');
 }else if(item.type==='card'){state.card.offered=true;expose('preco','Pulso Pay: “compre agora, pague depois” com limite pré-aprovado de R$ 500.');}
 else if(item.type==='trial')expose('dark_patterns','MODO+: “3 dias grátis” que viram assinatura automática, com VIP já marcado.');
 else if(item.type==='cartnudge'){expose('personalizacao','Lembrete do carrinho e de produtos que você visitou.');expose('urgencia','“Seus itens estão quase esgotando.”');}
 else if(item.type==='live')expose('influencia','A Lívia entrou ao vivo vendendo o tênis da semana.');
}
/* Posição sorteada dentro da janela [mín, máx], com semente da partida:
 * cada partida tem o roteiro em ordem diferente. */
function evAt(ev,d){
 if(!Array.isArray(ev.at))return ev.at;
 const [lo,hi]=ev.at;
 return lo+Pressure.hash(state.runId+':'+d.n+':'+ev.type+':'+(ev.thread||ev.post||''))%(hi-lo+1);
}
let scrollFastAt=0,lastScroll=null;
const fastScroll=()=>Date.now()-scrollFastAt<4000;
function streamArgs(d){
 const postIndex=catalogIndex();
 return {shown:dayItems().filter(x=>x.kind==='post'||x.kind==='ad'),profile:state.algorithm,personalized:state.personalized,phase:state.phase,cart:state.cart,viewed:state.viewed,purchased:state.purchases.map(p=>p.id),allowed:d.allow,focus:d.focus,day:d.n,seed:accountFeedSeed()+':'+d.n,
  postIndex,visualSignals:FeedRanker.compileSignals(state.algorithm,{postIndex,phase:state.phase}),
  infinite:false,exclude:dayItems().filter(x=>x.kind==='post').map(x=>x.id),fastScroll:fastScroll(),lowVibe:state.vibe.value<40};
}
function trackStreamItem(item,d){
 Pressure.vibeTick(state.vibe);
 if(item.swap){state.attention.adSwaps++;expose('rolagem_infinita','Quando você rolou rápido, o feed trocou um anúncio por post de amigo para te segurar.');}
 if(item.recycled)expose('rolagem_infinita','Uma publicação reapareceu na recomendação.');
 if(item.kind==='ad'){
  if(item.campaign==='retarget')expose('personalizacao',`${productName(item.topic)} voltou a aparecer depois que você demonstrou interesse.`);
  else if(item.campaign==='pair')expose('personalizacao',`Depois de uma compra, o feed sugeriu ${productName(item.topic)} “para combinar”.`);
 }
 state.phase=Math.min(15,Math.floor(streamItems().length/6));
}
/* Surpresas aparecem somente após alguma rolagem e ficam espaçadas.
 * A sorte continua variável: ~1/6 por item antes da cota e ~1/3 depois. */
function maybeSurprise(d){
 const postsToday=dayStreamCount();
 // Não premiar logo no início: pelo menos 10 posts/anúncios do dia.
 if(postsToday<12)return;
 // Após cada surpresa, mostrar 8 novos posts/anúncios antes da próxima.
 const itemsToday=dayItems();
 const previous=itemsToday.findLastIndex(x=>x.type==='surprise');
 if(previous>=0&&itemsToday.slice(previous+1).filter(x=>x.kind==='post'||x.kind==='ad').length<16)return;
 const n=state.feedItems.length,extra=postsToday>d.minQuota;
 if(Pressure.hash(state.runId+':s:'+n)%(extra?7:10)!==0)return;
 const seen=state.viewed.find(id=>products[id]&&!bought(id));
 const kinds=['coins','comment','nothing'].concat(seen?['drop']:[]);
 const variant=kinds[Pressure.hash(state.runId+':v:'+n)%kinds.length];
 const item={kind:'event',type:'surprise',variant,product:variant==='drop'?seen:'',id:'sp-'+d.n+'-'+n,day:d.n};
 state.feedItems.push(item);onEventInserted(item);
}
/* Passou das 23h rolando: anúncio emocional e a próxima manhã começa pior. */
function checkLate(d){
 if(clockMinutes()<23*60||state.flags['late'+d.n])return;
 state.flags['late'+d.n]=true;state.attention.lateNights++;
 expose('rolagem_infinita',`${d.label}: passou das 23h rolando o feed.`);
 if(!dayItems().some(x=>x.type==='mood')){const item={kind:'event',type:'mood',id:`ev-${d.n}-mood-late`,day:d.n};state.feedItems.push(item);onEventInserted(item);}
}
function appendNext(){
 const d=dayInfo();
 if(!d||state.finished||dayItems().some(x=>x.kind==='night'))return false;
 let added=0;
 const insertEvents=(force=false)=>{
  for(const [i,ev] of d.events.entries()){
   const id=`ev-${d.n}-${ev.type}-${i}`;
   if(state.feedItems.some(x=>x.id===id))continue;
   if(!force&&evAt(ev,d)>dayStreamCount())continue;
   const ok=eventApplies(ev);
   const item={kind:'event',id,type:ok?ev.type:'none',thread:ev.thread||'',post:ev.post||'',day:d.n,topic:ev.post?(Week.COMPARE_POSTS[ev.post]?.topic||''):''};
   state.feedItems.push(item);
   if(ok){added++;onEventInserted(item);}
  }
 };
 insertEvents();
 // Sem fim: depois do mínimo do dia o feed continua; o dia só acaba pelo menu ⋯.
 for(let i=0;i<5;i++){
  const batch=Stream.nextBatch(contentPool(),streamArgs(d),1);
  if(!batch.length)break;
  const item={...batch[0],day:d.n};
  state.feedItems.push(item);added++;
  trackStreamItem(item,d);
  if(dayStreamCount()>d.minQuota){
   state.attention.extraItems++;
   if(dayStreamCount()===d.minQuota+1)expose('rolagem_infinita',`${d.label}: o feed não acabou depois dos posts do dia e continuou trazendo conteúdo.`);
  }
  maybeSurprise(d);
  insertEvents();
  checkLate(d);
 }
 if(!added){insertEvents(true);state.feedItems.push({kind:'night',id:'night-'+d.n,day:d.n});added++;}
 save();
 return added>0;
}

/* ---------- conversas ---------- */
function deliverThread(key,day){
 const t=Week.THREADS[key];if(!t)return;
 const block=t.blocks.find(b=>b.day===day);if(!block)return;
 const th=state.threads[key]||(state.threads[key]={days:[],unread:0,picked:{}});
 if(th.days.includes(day))return;
 th.days.push(day);th.unread+=block.messages.length;
 if(block.ifMissing&&!bought(block.ifMissing.product)){
  (th.left||(th.left={}))[day]=true;th.unread+=block.ifMissing.messages.length;
  expose('fomo','No grupo da turma, combinaram algo só para quem tinha o tênis da moda.');
 }
 const preview=block.messages[Math.min(1,block.messages.length-1)][1];
 banner(`<span class="push-app">💬 ${esc(t.name)}</span><span class="push-text">${esc(preview)}</span>`,{'data-action':'chat','data-thread':key});
 if(key==='turma')expose('fomo','Grupo da turma comentando quem vai de tênis novo e quem comprou o quê.');
 if(key==='fest'){expose('fomo','Grupo do Pocket Fest: “só falta você 👀”.');expose('prova_social','No grupo, amigos dizendo “comprei!!”.');}
 if(key==='livia')expose('influencia','DM da Lívia: “cupom exclusivo SÓ pros meus seguidores”.');
 if(key==='pulso')expose('recompensa','Pulso Shop: “giro GRÁTIS na roleta, prêmio garantido”.');
}

function roletaPage(){

  const rad=a=>(a-90)*Math.PI/180,a0=rad(i*seg),a1=rad((i+1)*seg),mid=rad((i+.5)*seg);
  const p=(r,a)=>`${(150+r*Math.cos(a)).toFixed(1)} ${(150+r*Math.sin(a)).toFixed(1)}`;
  const tx=(150+95*Math.cos(mid)).toFixed(1),ty=(150+95*Math.sin(mid)).toFixed(1);
  return `<path d="M150 150 L${p(140,a0)} A140 140 0 0 1 ${p(140,a1)}Z" fill="${s.color}"/><text x="${tx}" y="${ty}" transform="rotate(${(i+.5)*seg} ${tx} ${ty})" text-anchor="middle" dominant-baseline="middle">${esc(s.short)}</text>`;
 }).join('');

 return `<header class="layer-head"><button class="icon-button" data-action="close-overlay" aria-label="Voltar ao feed">${icon('arrow')}</button><strong>Roleta Pulso Shop</strong></header>

/* Publicar, compartilhar story e atualizar manualmente compartilham uma
 * unica operacao. Os posts anteriores ficam estaveis; so o proximo lote
 * da recomendacao V6 e inserido no topo depois das publicacoes proprias. */
function refreshAndReturnToTop(reason='manual'){
 if(refreshing)return;
 const scroller=document.querySelector('#feed-scroll'),phone=document.querySelector('.phone');
 if(!scroller||!phone||state.finished||state.wake)return;
 refreshing=true;
 const generation=++refreshGeneration,run=state.runId,day=state.day;
 const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 document.querySelector('.layer-backdrop')?.remove();
 document.querySelector('.layer')?.remove();
 scroller.scrollTo({top:0,behavior:reduce?'instant':'smooth'});
 const loader=document.createElement('div');
 loader.className='feed-refresh-loading';loader.setAttribute('role','status');
 loader.innerHTML='<span class="feed-refresh-spinner" aria-hidden="true"></span><span>Atualizando seu feed…</span>';
 phone.appendChild(loader);
 setTimeout(()=>{
  if(generation!==refreshGeneration||run!==state.runId||day!==state.day||state.finished){refreshing=false;loader.remove();return;}
  const d=dayInfo();
  const batch=d?Stream.nextBatch(contentPool(),{...streamArgs(d),preferFriends:true},3):[];
  const items=batch.map(item=>({...item,day:d.n,fresh:true}));
  if(items.length){
   let idx=state.feedItems.findIndex(item=>(item.day||1)===state.day);
   idx=idx<0?state.feedItems.length:idx;
   // As fotos que o jogador acabou de postar continuam em primeiro lugar.
   while(state.feedItems[idx]?.day===state.day&&state.feedItems[idx]?.kind==='mine')idx++;
   state.feedItems.splice(idx,0,...items);
   for(const item of items)trackStreamItem(item,d);
  }
  state.attention.refreshes++;
  expose('personalizacao',items.length
    ?'Atualizacao do feed apos '+reason+': '+items.length+' conteudos novos selecionados pelo ranking de interesses, sem repetir postagens vistas.'
    :'Atualizacao do feed apos '+reason+': nenhuma nova publicacao estava disponivel na biblioteca do dia.');
  save();refreshing=false;renderGame(false);
  if(reason==='manual'&&!items.length)toast('Sem novas publicações neste momento.');
 },reduce?280:1050);
}

const postChoices=()=>{
 const result=new Map();
 const add=c=>{if(c?.photo&&!result.has(c.photo)&&mediaSrc(c.photo))result.set(c.photo,c);};
 POST_CHOICES.forEach(add);
 const samples=[...Object.values(window.NoFeedEditorial.posts).flat(),...LibraryV5.posts];
 const captionsByPhoto=new Map();
 for(const p of samples)if(p.photo&&!captionsByPhoto.has(p.photo))
   captionsByPhoto.set(p.photo,{topic:p.topic,caption:String(p.caption).split(' — ')[0].slice(0,120)});
 const topics=['garrafa','luminaria','fone','tenis','ingresso','mochila','plano'];
 for(const photo of Object.keys(originalPhotoSources)){
  if(!/^(extra_\d+|v5_\d+|post_p\d+|story_(?:fone|tenis|plano|mochila)_\d+)$/.test(photo))continue;
  const sample=captionsByPhoto.get(photo),t=sample?.topic||topics[result.size%topics.length];
  add({id:'galeria-'+photo,photo,topic:t,caption:sample?.caption||'Um momento para guardar ✨'});
 }
 for(const [photo,topic,caption] of GALLERY_SCENES)add({id:'galeria-'+photo,photo,topic,caption});
 for(const id of [...new Set(state.purchases.map(p=>p.id))].filter(id=>products[id])){
  add({id:'purchase-'+id,photo:'product_'+id,topic:id,caption:'Chegou o '+productName(id)+'! 📦✨'});
 }
 return [...result.values()];
};
const ownPostAge=p=>Math.max(0,(state.day-p.day)*40+(state.clockViewed||0)-(p.clockViewed||0));
const myLikes=p=>Math.min(p.target||30,Math.round((p.target||30)*Math.min(1,.25+ownPostAge(p)*.10)))+((state.mineLikes||[]).includes(p.id)?1:0);
function ownPostComments(p){
 const fromPurchase=p.origin==='purchase';
 const templates=fromPurchase?
   [['bia.m','amei! onde você comprou? 😍'],['lucca.r','o pessoal vai querer também 👀'],['mia','ficou lindo! 🔥'],['gabi.n','agora quero ver de perto ✨']]:
   [['bia.m','ameeei essa foto 💜'],['lucca.r','que registro bom!'],['mia','arrasou ✨'],['gabi.n','precisamos repetir esse dia 🥹']];
 const count=Math.min(4,1+Math.floor(ownPostAge(p)/3));
 return [...templates.slice(0,count).map(([u,t],i)=>[u,t,`há ${i+1} min`]),...(p.comments||[])];
}
function toggleOwnLike(id,like){
 const p=state.myPosts.find(x=>x.id===id);if(!p)return;
 const index=state.mineLikes.indexOf(id);
 if(like&&index<0)state.mineLikes.push(id);
 if(!like&&index>=0)state.mineLikes.splice(index,1);
 save();
 const card=document.querySelector('.mine-post[data-rec-id="'+id+'"]');
 if(!card)return;
 const btn=card.querySelector('[data-action="like-mine"]');
 if(btn){btn.classList.toggle('is-liked',like);btn.setAttribute('aria-pressed',String(like));btn.querySelector('.ico')?.classList.toggle('heart-filled',like);}
 const likes=card.querySelector('.js-my-likes');if(likes)likes.textContent=myLikes(p);
}

function countTime(){
 if(!identity||!state.started||state.finished||state.wake||document.visibilityState!=='visible')return;
 state.attention.realMs+=1000;
 if(state.attention.realMs>=TIME_LIMIT_MS){state.flags.timeLimit=true;finishWeek();return;}
 if(state.attention.realMs%10000===0)save();
}

function openProduct(id,source){
 if(!products[id])return;
 clearTimeout(storeOpenTimer);storeOpenTimer=null;
 if(story)stopStory();
 const from=overlay?.type==="shop"?"shop":overlay?.type==="cart"?"cart":overlay?.from==="shop"?"shop":"feed";
 if(source)state.context[id]=source;else if(!state.context[id])state.context[id]=from;
 if(!state.viewed.includes(id)){state.viewed.push(id);pushEvent("view",`Visitou a loja ${products[id].brand}`);}
 signal(id,2);trackModel("product",id,id);

 }

 if(pr.old){
  const anchors=state.anchors[id]||(state.anchors[id]=[]);
  if(!anchors.includes(pr.old))anchors.push(pr.old);
  expose('preco',anchors.length>1?`O preço “de” do ${name} mudou de ${money(anchors[0])} para ${money(anchors.at(-1))} durante a semana.`:`${name}: “de ${money(pr.old)} por ${money(pr.price)}”.`);
 }

function backFromShop(){
 if(!overlay)return;
 if(overlay.type==="checkout"){
  overlay=overlay.from==="cart"?{type:"cart"}:{type:"product",id:overlay.items[0],from:overlay.from||"feed"};
  drawOverlay();return;
 }
 if(overlay.type==="product"){
  if(overlay.from==="shop"){overlay={type:"shop"};drawOverlay();return;}
  if(overlay.from==="cart"){overlay={type:"cart"};drawOverlay();return;}
 }
 closeOverlay();
}
function addToCart(id){
 if(!products[id])return;
 if(bought(id)){toast("Produto já comprado.");return;}
 if(!state.cart.includes(id)){
  state.cart.push(id);signal(id,3);
  pushEvent("cart",`Adicionou ${productName(id)} à sacola`);
  trackModel("cart",id,id);
  if(!state.flags.cartHold)state.flags.cartHold=Date.now()+600000;
  expose('urgencia','Sacola: “itens reservados por 10:00”.');
 }
 save();
 if(overlay?.type==="product"&&overlay.id===id)drawOverlay();
 else{overlay={type:"cart"};drawOverlay();}
 toast(`${productName(id)} está na sua sacola 🛍️`);
}

function adCard(id,retarget=false,item={}){

function vibeChart(){
 const log=state.vibe.log.filter(p=>p.tag!=='tick'||p.x%2===0);
 if(log.length<2)return '';
 const W=600,H=190,maxX=Math.max(1,...log.map(p=>p.x));
 const lo=Math.max(0,Math.min(...log.map(p=>p.v))-8),hi=Math.min(100,Math.max(...log.map(p=>p.v))+8),span=Math.max(10,hi-lo);
 const X=x=>12+x/maxX*(W-24),Y=v=>H-14-(v-lo)/span*(H-28);
 const line=log.map(p=>`${X(p.x).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
 const marks=state.vibe.log.filter(p=>p.tag==='buy'||p.tag==='compare').map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="6" class="vm-${p.tag}"><title>${esc(p.label)}</title></circle>`).join('');
 return `<figure class="vibe-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico da sua vibe ao longo da semana">${lo<50&&hi>50?`<line x1="12" x2="${W-12}" y1="${Y(50)}" y2="${Y(50)}" class="vm-mid"/>`:''}<polyline points="${line}" class="vm-line"/>${marks}</svg>
 <figcaption><span><i class="vm-buy-dot"></i> compra</span><span><i class="vm-compare-dot"></i> comparação com amigos</span></figcaption></figure>`;
}

function readableDuration(totalSeconds){
 const seconds=Math.max(0,Math.round(Number(totalSeconds)||0)),hours=Math.floor(seconds/3600),minutes=Math.floor(seconds%3600/60),rest=seconds%60;
 return hours?hours+'h '+String(minutes).padStart(2,'0')+'min '+String(rest).padStart(2,'0')+'s'
  :minutes+'min '+String(rest).padStart(2,'0')+'s';
}
function attentionTimeFeedback(){
 const a=state.attention,actual=Math.max(0,Math.round(a.realMs/1000)),estimated=Math.max(1,Number(a.guess)||1)*60;
 const diff=actual-estimated,abs=Math.abs(diff);
 let title,explanation;
 if(abs<=60){
  title='Você percebeu bem o tempo. ⏱️';
  explanation='Sua estimativa ficou próxima do tempo registrado. Mesmo assim, a sucessão de posts, mensagens e novidades pode dificultar perceber quando parar.';
 }else if(diff>0&&actual>=estimated*2){
  title='O tempo passou mais rápido do que parecia. ⏳';
  explanation='Você ficou pelo menos o dobro do tempo que imaginava. Quando não há uma parada natural no feed, é fácil continuar vendo só mais uma publicação.';
 }else if(diff>0){
  title='Você ficou mais do que imaginava. 🌀';
  explanation='O tempo registrado foi maior que sua estimativa. Conteúdos novos, notificações e ofertas podem dar a sensação de que sempre falta ver alguma coisa.';
 }else{
  title='Você superestimou o tempo. 👀';
  explanation='Você percebeu a sessão como mais longa do que ela realmente foi. O ritmo das interações influencia a sensação de tempo; duração percebida e duração registrada nem sempre coincidem.';
 }
 const hints=[];
 if(a.extraItems>=8)hints.push('Você consumiu '+a.extraItems+' conteúdos extras além das primeiras publicações do dia.');
 if(a.refreshes>=2)hints.push('Atualizações frequentes trouxeram novas recomendações.');
 if(a.exitHooks>0)hints.push('Avisos sobre amigos apareceram quando você considerou sair.');
 if(a.surprises>0)hints.push('Recompensas variáveis deram novos motivos para continuar.');
 if(state.myPosts.length||state.myStories.length)hints.push('Seus próprios posts e stories também incentivaram novas visitas ao feed.');
 if(a.lateNights>0)hints.push('Você continuou rolando depois das 23h em '+a.lateNights+' noite(s) da simulação.');
 if(!hints.length)hints.push('Mesmo sem muitas interações, o fluxo contínuo de conteúdo pode prender a atenção.');
 return {title,explanation,observations:hints.slice(0,2),actual,estimated,abs,diff};
}

async function sendCompletedC4(){
 if(!identity||!state.finished||(state.endStep!==3&&state.endPrelude!=='mcp')||state.c4SyncedRunId===state.runId||syncInFlight)return;
 const playerId=identity.id,run=state.runId;
 syncInFlight=true;syncMessage='';
 showC4SyncStatus();
 try{
  const payload=ExportC4.build(state,{pressure:Pressure,recommender:Recommender});
  const result=await ContaC4.complete(payload);
  if(result?.usuario?.id!==playerId||result?.partida!==run)
   throw Error('O servidor não confirmou a conta e a partida corretas.');
  if(!identity||identity.id!==playerId||state.runId!==run)return;
  state.c4SyncedRunId=run;
  state.c4SyncedAt=new Date().toISOString();
  save();
  syncMessage='';
 }catch(error){
  if(identity?.id===playerId&&state.runId===run)
   syncMessage=(error?.message||'Não foi possível enviar a partida.')+(ContaC4.account()?' Tente novamente;':' Entre novamente com seu apelido;')+' seu progresso continua salvo neste dispositivo.';
 }finally{syncInFlight=false;showC4SyncStatus();const status=root.querySelector('#trip-mcp-status');if(status)status.textContent=state.c4SyncedRunId===state.runId?'✓ Percurso recebido pelo MCP.':syncMessage||'O servidor não confirmou o envio.';const btn=root.querySelector('[data-action="trip-mcp"]');if(btn){const success=state.c4SyncedRunId===state.runId;btn.disabled=success;btn.textContent=success?'✓ Enviado ao MCP':'Tentar carregar novamente para o MCP';}}
}

let lastLikeFlash={photo:null,time:0};
let feedTouchStart=null,lastFeedTouchTap=null;
function setLikeState(kind,id,shouldLike){
 const isAd=kind==="ad";
 const topic=isAd?String(id).replace(/^ad-(main|ret|pair)-/,""):postInfo(id)?.topic;
 if(!topic||!Recommender.topics.includes(topic))return false;
 const bucket=isAd?state.likedAds:state.liked;
 const current=bucket.includes(id);
 if(current===shouldLike)return false;
 if(shouldLike){
  bucket.push(id);
  if(isAd){signal(topic,1);trackModel("adLike",topic,id);}
  else{const info=postInfo(id);trackModel("like",topic,id,info?.who||"");}
 }else{
  bucket.splice(bucket.indexOf(id),1);
  const info=isAd?null:postInfo(id);
  trackModel("unlike",topic,id,info?.who||"");
 }
 save();
 return true;
}
function reflectLike(article){
 if(!article)return;
 const ad=article.classList.contains("ad-post"),id=article.dataset.recId;
 if(!id)return;
 const liked=ad?state.likedAds.includes(id):state.liked.includes(id);
 const button=article.querySelector(ad?'[data-action="like-ad"]':'[data-action="like"]');
 if(button){
  button.classList.toggle("is-liked",liked);
  button.setAttribute("aria-pressed",String(liked));
  button.setAttribute("aria-label",`${liked?"Descurtir":"Curtir"} ${ad?"anúncio":"publicação"}`);
  button.querySelector(".ico")?.classList.toggle("heart-filled",liked);
 }
 if(!ad){
  const base=postInfo(id)?.likes;
  const count=article.querySelector(".likecount");
  if(Number.isFinite(base)&&count)count.textContent=`${base+(liked?1:0)} curtidas`;
 }
}
function likeFeedPhoto(photo){
 if(!photo||!photo.isConnected)return;
 const article=photo.closest(".post");
 if(!article)return;
 const ad=article.classList.contains("ad-post");
 const id=article.dataset.recId;
 if(article.classList.contains('mine-post'))toggleOwnLike(id,true);
 else{setLikeState(ad?"ad":"post",id,true);reflectLike(article);}
 const now=performance.now();
 if(lastLikeFlash.photo===photo&&now-lastLikeFlash.time<250)return;
 lastLikeFlash={photo,time:now};
 photo.querySelector(".photo-like-burst")?.remove();
 const burst=document.createElement("span");
 burst.className="photo-like-burst";
 burst.setAttribute("aria-hidden","true");
 burst.innerHTML=icon("heart","heart-filled");
 photo.appendChild(burst);
 setTimeout(()=>burst.remove(),680);
}
function handleFeedTouchStart(e){
 if(e.pointerType!=="touch")return;
 const photo=e.target.closest(".feed-photo");
 feedTouchStart=photo?{id:e.pointerId,photo,x:e.clientX,y:e.clientY}:null;
}
function handleFeedTouchEnd(e){
 if(e.pointerType!=="touch")return;
 const tap=feedTouchStart;
 feedTouchStart=null;
 if(!tap||tap.id!==e.pointerId||!tap.photo.isConnected)return;
 if(Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>18){
  lastFeedTouchTap=null;return;
 }
 const now=performance.now(),prior=lastFeedTouchTap;
 if(prior&&prior.photo===tap.photo&&now-prior.time<340&&Math.hypot(prior.x-e.clientX,prior.y-e.clientY)<38){
  lastFeedTouchTap=null;
  e.preventDefault();
  cancelPhotoShopClick();
  likeFeedPhoto(tap.photo);
 }else lastFeedTouchTap={photo:tap.photo,time:now,x:e.clientX,y:e.clientY};
}
function handleFeedTouchCancel(){
 feedTouchStart=null;
}

 else if(a==='gallery-cancel'){const g=modal;modal={type:g.returnType||'new-post',postId:g.postId,choice:g.previousChoice,caption:g.draft};drawModal();}
 else if(a==='gallery-filter'){modal.filter=el.dataset.filter;drawModal();}
 else if(a==='gallery-select'){const oldScroll=document.querySelector('.ios-gallery-grid')?.scrollTop||0;modal.selectedChoice=el.dataset.choice;drawModal();const grid=document.querySelector('.ios-gallery-grid');if(grid)grid.scrollTop=oldScroll;}
 else if(a==='gallery-confirm'){const g=modal;const selected=postChoices().find(c=>c.id===g?.selectedChoice);if(!selected)return;modal={type:g.returnType||'new-post',postId:g.postId,choice:selected.id,caption:selected.id===g.previousChoice?g.draft:selected.caption};drawModal();}
 else if(a==='publish'){publishPost(modal?.choice||el.dataset.choice);}
 else if(a==='purchase-share'){sharePurchase(el.dataset.channel);}
 else if(a==='share-mine-story'){shareOwnPostToStory(post);}
 else if(a==='like-mine'){toggleOwnLike(post,!state.mineLikes.includes(post));}
 else if(a==='bookmark-mine'){const k=state.bookmarks.indexOf(post);if(k<0)state.bookmarks.push(post);else state.bookmarks.splice(k,1);save();renderGame(true);}
 else if(a==='add-my-comment'){
  const p=state.myPosts.find(x=>x.id===post),message=String(document.querySelector('#own-comment-input')?.value||'').trim().slice(0,180);
  if(!message){toast('Escreva um comentário.');}
  else if(p){
   if(p.comments.length>=15){toast('Limite de comentários da publicação atingido.');return;}
   p.comments.push([identity?.username||'você',message,'agora']);
   pushEvent('comentario_proprio','Comentou em uma publicação própria.');save();drawModal();
  }else{
   const total=Object.values(state.postComments).reduce((sum,items)=>sum+(Array.isArray(items)?items.length:0),0);
   if(total>=300||(state.postComments[post]||[]).length>=15){toast('Limite de comentários da partida atingido.');return;}
   if(!/^[a-zA-Z0-9_-]+$/.test(post)){toast('Não é possível comentar nesta publicação.');return;}
   (state.postComments[post]||=[]).push([identity?.username||'você',message,'agora']);
   pushEvent('comentario_post','Comentou em uma publicação fictícia.');save();drawModal();
  }
 }
 else if(a==='edit-my-post'){const p=state.myPosts.find(x=>x.id===post);if(p){modal={type:'edit-post',postId:p.id,choice:p.choice,caption:p.caption||''};drawModal();}}
 else if(a==='save-my-post'){const p=state.myPosts.find(x=>x.id===modal?.postId);const selected=postChoices().find(c=>c.id===modal?.choice);if(p&&selected){p.choice=selected.id;p.photo=selected.photo;p.topic=selected.topic;p.caption=String(document.getElementById('my-post-caption')?.value||'').trim().slice(0,220)||selected.caption;save();}modal=null;renderGame(true);toast('Publicação atualizada.');}
 else if(a==='remove-my-post'){const pid=modal?.postId;state.myPosts=state.myPosts.filter(x=>x.id!==pid);state.feedItems=state.feedItems.filter(x=>x.id!==pid);modal=null;save();renderGame(true);toast('Publicação excluída.');}
 else if(a==='guess-time'){const v=Number(document.getElementById('time-guess')?.value)||10;state.attention.guess=v;save();renderEnd();}
 else if(a==='load-more'){if(appendNext())renderGame(true);}
 else if(a==='finish'){finishWeek();}
 else if(a==='export-c4'){
  const info=document.querySelector('.export-c4-status');
  try{
   save();
   const data=ExportC4.build(state,{pressure:Pressure,recommender:Recommender});
   ExportC4.download(data);
   if(info)info.textContent='Cópia JSON baixada. O envio ao MCP acontece automaticamente ao terminar o quiz.';
  }catch(error){if(info)info.textContent=error.message||'Não foi possível exportar.';}
 }
 else if(a==='retry-c4'){if(ContaC4.account())void sendCompletedC4();else void switchPlayer();}
 else if(a==='switch-player'){void switchPlayer();}
 else if(a==='end-next'){state.endStep=Math.min(3,(state.endStep||0)+1);save();renderEnd();}
 else if(a==='quiz'){answerQuizOption(el);}
 else if(a==='inbox'){if(story)stopStory();closeModal();overlay={type:'inbox'};drawOverlay();}
 else if(a==='chat'){el.closest('.push-banner')?.remove();openChat(el.dataset.thread);}
 else if(a==='chat-choice'){chooseChat(el.dataset.thread,Number(el.dataset.day),el.dataset.choice);}
 else if(a==='roleta'){if(story)stopStory();closeModal();overlay={type:'roleta'};drawOverlay();}
 else if(a==='spin'){spin();}
 else if(a==='pay'){if(story)stopStory();closeModal();overlay={type:'pay'};drawOverlay();}
 else if(a==='activate-card'){closeModal();activateCard(overlay?.type==='checkout'?'checkout':'pay');}
 else if(a==='activate-card-checkout'){activateCard('checkout');}
 else if(a==='decline-card'){modal={type:'decline-card'};drawModal();expose('dark_patterns','Para recusar o Pulso Pay: “Não, prefiro pagar tudo à vista” e depois “Não quero facilidades”.');}
 else if(a==='card-no'){closeModal();closeOverlay();toast('Tudo bem. A oferta fica no seu perfil.');}
 else if(a==='live'){openLive();}
 else if(a==='live-buy'){state.context.tenis='live';save();openCheckout(['tenis'],'live');}
 else if(a==='leave-live'){const c=activeCoupons().find(c=>c.code==='LIVIA15');if(c&&!bought('tenis')){modal={type:'leave-live'};drawModal();expose('dark_patterns','Ao sair da live: “Sair e perder meu desconto”.');}else{clearInterval(liveTimer);closeOverlay();}}
 else if(a==='live-exit'){closeModal();clearInterval(liveTimer);closeOverlay();}
 else if(a==='sale'){if(story)stopStory();closeModal();overlay={type:'shop'};drawOverlay();}
 else if(a==='trial'){state.context.plano=state.context.plano||'trial';openCheckout(['plano'],overlay?.from||'feed',true);}
 else if(a==='variant'){state.variant.fone=el.dataset.variant;save();drawOverlay();}
 else if(a==='add-to-order'){if(overlay?.type==='checkout'&&products[id]&&!overlay.items.includes(id)){overlay.items.push(id);state.context[id]=state.context[id]||'shop';influenced(['preco','dark_patterns'],`Adicionou ${productName(id)} ao pedido para “liberar” frete grátis ou cupom.`);drawOverlay();}}
 else if(a==='exit-accept'){const v=modal;closeModal();if(v?.id){addCoupon({code:'VOLTA10-'+v.id.toUpperCase(),label:'10% OFF extra',kind:'pct',amount:10,min:0,only:[v.id],expiresDay:state.day,until:v.until,source:'exit'});state.context[v.id]='exit';influenced(['dark_patterns'],`Ia sair do ${productName(v.id)}, mas aceitou o “10% OFF só agora”.`);drawOverlay();toast('Cupom de 10% aplicado 🎁');}}
 else if(a==='exit-decline'){closeModal();closeOverlay();toast('Você voltou ao feed.');}
 else if(a==='subs'){overlay={type:'subs'};drawOverlay();}
 else if(a==='cancel-sub'){cancelSubStep();}
 else if(a==='keep-sub'){if(state.flags.cancelStep)influenced(['dark_patterns'],'Desistiu de cancelar a assinatura depois do “Tem certeza?”.');state.flags.cancelStep=0;save();drawOverlay();}
 else if(a==='sub-discount'){const sub=state.subscriptions.find(x=>x.active);if(sub){sub.monthly=Pressure.round(sub.monthly/2);sub.name+=' (50% OFF)';}state.flags.cancelStep=0;influenced(['dark_patterns'],'Aceitou a oferta de retenção em vez de cancelar a assinatura.');save();drawOverlay();}
 else if(a==='sub-help'){toast('Opção indisponível no momento.');}
 else if(a==='vibe-info'){const m=Pressure.vibeMood(state.vibe.value);toast(`Vibe: ${m.label} ${m.emoji} · Um mimo sempre levanta o astral ✨`);expose('emocao','O app sugeria que “um mimo sempre levanta o astral”.');}
 else if(a==='coins-info'){toast(`Você tem ${money(state.coins)} em moedas. Use em compras acima de R$ 50 · expiram sexta 23:59.`);}
 else if(a==='story'){startStory(Number(el.dataset.index));}
 else if(a==='story-next'){advanceStory(1);}
 else if(a==='story-prev'){advanceStory(-1);}
 else if(a==='story-pause'){toggleStoryPause();}
 else if(a==='close-story'){stopStory();}
 else if(a==='like'){
  setLikeState("post",post,!state.liked.includes(post));
  reflectLike(el.closest(".post"));
 }
 else if(a==='bookmark'){
  const info=postInfo(post),index=state.bookmarks.indexOf(post);
  if(index<0){state.bookmarks.push(post);if(info)trackModel('bookmark',info.topic,post,info.who);}
  else{state.bookmarks.splice(index,1);if(info)trackModel('unbookmark',info.topic,post,info.who);}
  save();renderGame(true);
 }
 else if(a==='like-ad'){
  const ad=el.dataset.ad;
  setLikeState("ad",ad,!state.likedAds.includes(ad));
  reflectLike(el.closest(".post"));
 }
 else if(a==='comments')openComments(post)
 else if(a==='product'){el.closest('.push-banner')?.remove();openProduct(id,el.dataset.source);}
 else if(a==='shop'||a==='search'){openShop();}
 else if(a==='open-photo'){scheduleShopFromPhoto(el);}
 else if(a==='shop-back'){backFromShop();}
 else if(a==='checkout'){openCheckout([id],overlay?.from||'feed');}
 else if(a==='checkout-cart'){openCheckout(state.cart.slice(),'cart');}
 else if(a==='story-product'){stopStory();openProduct(id,'story');}
 else if(a==='goal'){overlay={type:'goal'};modal=null;drawOverlay();}
 else if(a==='pass'){
  trackModel('skip',id,id);pushEvent('skip',`Saiu da loja de ${productName(id)} sem comprar`);
  if(!state.exitOffers.includes(id)&&!bought(id)&&id!=='plano'){state.exitOffers.push(id);save();modal={type:'exit',id,until:Date.now()+300000};drawModal();expose('dark_patterns',`Ao tentar sair do ${productName(id)}: “Não, prefiro pagar mais caro”.`);expose('urgencia','Oferta de saída: “10% OFF só agora, expira em 05:00”.');}
  else{closeOverlay();toast('Você voltou ao feed.');}
 }
 else if(a==='less'){
  const topic=el.dataset.topic,target=post;
  if(Recommender.topics.includes(topic)&&target){
   trackModel('less',topic,target);
   expose('personalizacao_dificil','Você pediu “Mostrar menos”, mas o pedido perde força em poucos posts e o tema volta por assuntos vizinhos.');
   if(!state.hiddenPosts.includes(target))state.hiddenPosts.push(target);
   save();
  }
  closeModal();renderGame(true);toast('Você verá menos conteúdo parecido.');
 }
 else if(a==='close-modal')closeModal()
 else if(a==='post-more'||a==='ad-more'){const card=el.closest('.post');modal={type:'more',post:card?.dataset.recId||'',topic:card?.dataset.recTopic||''};drawModal();}
 else if(a==='close-overlay'){if(overlay?.type==='receipt')sharePurchase('nenhum');else closeOverlay();}
 else if(a==='cart'){overlay={type:'cart'};drawOverlay();}
 else if(a==='profile'){overlay={type:'profile'};drawOverlay();}
 else if(a==='profile-post'){overlay={type:'own-post',id:post};drawOverlay();}
 else if(a==='notifications'){overlay={type:'notifications'};drawOverlay();}
 else if(a==='share')toast('Link copiado ✓')
 else if(a==='feedtop')document.querySelector('#feed-scroll')?.scrollTo({top:0,behavior:'smooth'});
 else if(a==='scroll-cue')document.querySelector('#feed-scroll')?.scrollBy({top:340,behavior:'smooth'});
 else if(a==='add-cart')addToCart(id)
 else if(a==='remove-cart'){state.cart=state.cart.filter(x=>x!==id);trackModel('removeCart',id,id);save();overlay={type:'cart'};drawOverlay();}
 else if(a==='buy')buy(overlay?.items||[])
 else if(a==='algorithm-final'){
  const panel=document.getElementById('algorithm-final-panel');
  if(panel){
   panel.hidden=!panel.hidden;
   el.setAttribute('aria-expanded',String(!panel.hidden));
   el.textContent=panel.hidden?'ⓘ Entender como o algoritmo influenciou meu feed':'Ocultar explicação do algoritmo';
   if(!panel.hidden)panel.scrollIntoView({block:'start',behavior:'smooth'});
  }
 }
 else if(a==='restart'){
  if(state.finished&&state.endStep===3&&state.c4SyncedRunId!==state.runId&&
    !confirm('Seu percurso ainda não foi recebido pelo MCP. Reiniciar agora pode impedir o envio. Quer continuar?'))return;
  restart();
 }
 else if(a==='sources'){const node=document.querySelector('#sources');if(node){node.hidden=!node.hidden;if(!node.hidden)node.scrollIntoView({block:'nearest',behavior:'smooth'});}}
});

root.addEventListener('dblclick',e=>{
 const photo=e.target.closest('.feed-photo');
 if(!photo)return;
 e.preventDefault();
 cancelPhotoShopClick();
 likeFeedPhoto(photo);
});
root.addEventListener('pointerdown',handleFeedTouchStart);
root.addEventListener('pointerup',handleFeedTouchEnd);
root.addEventListener('pointercancel',handleFeedTouchCancel);
root.addEventListener('change',e=>{const tg=e.target;if(tg?.dataset?.protect){state.protection[tg.dataset.protect]=tg.checked;save();drawOverlay();return;}if(tg?.id==='coins-toggle'){state.coinsOn=tg.checked;save();drawOverlay();return;}if(tg?.name==='pay'){state.payMethod=tg.value;save();drawOverlay();return;}if(e.target?.id==='vip-extra'){state.extraChecked=e.target.checked;save();if(overlay?.type==='checkout'||overlay?.type==='product')drawOverlay();}if(e.target?.id==='privacy-switch'){state.personalized=e.target.checked;save();renderGame(true);toast(state.personalized?'Recomendações personalizadas ativadas.':'Ordem cronológica e coleta de sinais desativadas.');}});
window.addEventListener('keydown',e=>{
 if(!exitConfirm.hidden){
  if(e.key==='Escape'){e.preventDefault();closeExitConfirm();}
  else if(e.key==='Tab'){
   if(e.shiftKey&&document.activeElement===exitCancel){e.preventDefault();exitAccept.focus();}
   else if(!e.shiftKey&&document.activeElement===exitAccept){e.preventDefault();exitCancel.focus();}
  }
  return;
 }
 const tagPopup=document.querySelector('.tag-vibe-overlay');
 if(tagPopup){
  if(e.key==='Escape'){e.preventDefault();closeTaggedVibeCelebration(false);}
  if(e.key==='Tab'){const buttons=[...tagPopup.querySelectorAll('button')],i=buttons.indexOf(document.activeElement);if(i>=0){e.preventDefault();buttons[(i+(e.shiftKey?buttons.length-1:1))%buttons.length].focus();}}
  return;
 }
 const sleepPopup=document.querySelector('.sleep-reminder');
 if(sleepPopup){
  if(e.key==='Escape'){e.preventDefault();closeSleepReminder();}
  if(e.key==='Tab'){const buttons=[...sleepPopup.querySelectorAll('button')],i=buttons.indexOf(document.activeElement);if(i>=0){e.preventDefault();buttons[(i+(e.shiftKey?buttons.length-1:1))%buttons.length].focus();}}
  return;
 }
 if(document.querySelector('.reward-celebration')){
  if(e.key==='Escape'){e.preventDefault();closeRewardCelebration();}
  if(e.key==='Tab'){e.preventDefault();document.querySelector('.reward-continue')?.focus();}
  return;
 }
 if(story){
  if(e.key==='Escape'){e.preventDefault();stopStory();return;}
  if(e.key==='ArrowRight'){e.preventDefault();advanceStory(1);return;}
  if(e.key==='ArrowLeft'){e.preventDefault();advanceStory(-1);return;}
  if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();toggleStoryPause();return;}
 }
 if(e.key==='Escape'){if(modal)closeModal();else if(overlay)closeOverlay();}
});
root.addEventListener('pointerdown',storyPointerDown);
root.addEventListener('pointerup',storyPointerUp);
root.addEventListener('pointercancel',storyPointerCancel);
document.addEventListener('visibilitychange',()=>{
 if(!story)return;
 if(document.hidden)pauseStory('hidden');
 else resumeStory('hidden');
});
renderAccountGate();
if(ContaC4.account()){
 ContaC4.validate().then(user=>{
  if(!user){renderAccountGate('Sua sessão expirou. Entre novamente para continuar.');return;}
  installPlayer(user);
 }).catch(error=>renderAccountGate(error?.message||'Entre novamente para continuar.'));
}
})();
</script>
</body>
</html>
