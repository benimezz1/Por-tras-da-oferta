function drawOverlay(){const phone=document.querySelector('.phone');if(!phone)return;document.querySelector('.layer')?.remove();const wrap=document.createElement('div');wrap.className='layer';const id=overlay.id;if(overlay.type==='product'){
 const p=products[id];const choice=id==='plano'?`<label class="option-row"><input id="vip-extra" type="checkbox" ${state.extraChecked?'checked':''}/><span><strong>Adicionar recursos VIP (+ ${money(9.90)}/mês)</strong><br><small class="muted">Adicional opcional. A loja deixou essa opção marcada.</small></span></label>`:'';
 wrap.innerHTML=`<header class="layer-head"><button class="icon-button" data-action="close-overlay" aria-label="Voltar ao feed">${icon('arrow')}</button><strong>site · ${p.brand}</strong><span style="margin-left:auto" class="small muted">🔒 compra simulada</span></header><div class="layer-body"><div class="product-hero">${art(p.kind,true,p.brand)}</div><section class="product-info"><p class="eyebrow">${p.label}</p><h2>${p.name}</h2><p class="product-desc">${p.desc}</p><div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:14px 0">${p.old?`<span class="old-price">${money(p.old)}</span>`:''}<span class="new-price">${money(p.price)}</span><span class="deal-bubble">${id==='plano'?'por mês':'Preço da campanha*'}</span></div><div class="product-specs">${p.specs.map(s=>`<div class="spec">${s}</div>`).join('')}</div><button class="reviews-shortcut" data-action="comments" data-post="ad-main-${id}"><div><strong>★ Avaliações e comentários</strong><div class="review-note">Opiniões positivas e negativas da simulação</div></div>${icon('chevron')}</button>${choice}<p class="warning-note">* Produto, comentários, marcas, alegações comerciais e preços fictícios. Anúncios não são ofertas reais.</p></section></div><div class="product-foot"><button class="secondary" data-action="add-cart" data-product="${id}">${state.cart.includes(id)?'✓ Salvo no carrinho':'Salvar no carrinho'}</button><button class="primary" data-action="buy" data-product="${id}">${id==='plano'?`Assinar · ${money(p.price+(state.extraChecked?9.90:0))}/mês`:'Comprar agora'}</button></div>`;
 }else if(overlay.type==='cart'){wrap.innerHTML=`<header class="layer-head"><button class="icon-button" data-action="close-overlay" aria-label="Voltar ao feed">${icon('arrow')}</button><strong>Seu carrinho</strong><span style="margin-left:auto" class="pill">${state.cart.length} item(ns)</span></header><div class="layer-body" style="padding:14px 18px">${state.cart.length?state.cart.map(id=>{const p=products[id];return `<div class="cart-item"><div class="cart-thumb">${art(p.kind,true)}</div><div class="cart-item-text"><strong>${p.name}</strong><p>${money(p.price)}${id==='plano'?'/mês':''}</p><button class="text-link" data-action="remove-cart" data-product="${id}">Remover</button></div><button class="tiny-button" data-action="product" data-product="${id}">Ver</button></div>`}).join(''):`<div class="empty"><div style="font-size:44px">🛒</div><p>Seu carrinho está vazio.</p><p class="small">Salvar algo não significa que você precisa comprar.</p></div>`}<p class="small muted" style="margin-top:20px">As lojas da simulação podem usar itens salvos para oferecer novos anúncios personalizados.</p></div>`;
 }else if(overlay.type==='profile'){wrap.innerHTML=`<header class="layer-head"><button class="icon-button" data-action="close-overlay" aria-label="Voltar">${icon('arrow')}</button><strong>Meu perfil</strong></header><div class="layer-body" style="padding:22px"><div style="text-align:center;padding:8px 0 22px"><div class="avatar" style="margin:auto;width:74px;height:74px;font-size:35px">🙂</div><h3 style="margin:12px 0 4px">você</h3><p class="small muted">Perfil fictício da simulação</p></div><div class="end-box" style="padding:15px;margin:0"><strong style="font-size:13px">Seu saldo</strong><div style="font-size:24px;font-weight:850;margin:8px 0">${money(state.wallet)}</div><p class="small muted">Objetivo reservado: ${money(state.goal)}</p></div><label class="option-row"><input id="privacy-switch" type="checkbox" ${state.personalized?'checked':''}/><span><strong>Anúncios personalizados</strong><br><small class="muted">Se desligar, o feed deixa de repetir ofertas com base nas suas interações simuladas.</small></span></label><p class="small muted">Desligar anúncios personalizados não elimina todos os anúncios.</p></div>`;
 }else if(overlay.type==='notifications'){wrap.innerHTML=`<header class="layer-head"><button class="icon-button" data-action="close-overlay">${icon('arrow')}</button><strong>Notificações</strong></header><div class="layer-body" style="padding:20px"><h3 style="font-size:19px">Novidades no seu feed</h3>${state.cart.length?state.cart.map(id=>`<button class="reviews-shortcut" data-action="product" data-product="${id}"><span>🛍️ ${products[id].name} continua no seu carrinho</span>${icon('chevron')}</button>`).join(''):'<p class="small muted">Nenhuma novidade por aqui.</p>'}<p class="small muted">As notificações são fictícias.</p></div>`;
 }
 phone.appendChild(wrap);
}
function drawModal(){const phone=document.querySelector('.phone');if(!phone)return;document.querySelector('.layer-backdrop')?.remove();const v=modal;let content='';if(v.type==='comments'){
 let comments=[];let title='Comentários';if(v.post.startsWith('ad-main-')||v.post.startsWith('ad-ret-')){let id=v.post.replace(/^ad-(main|ret)-/,'');comments=products[id].reviews;title=`Opiniões sobre ${products[id].name}`;}else{for(const ph of phases){const post=ph.posts.find(x=>x.id===v.post);if(post){comments=post.comments.map((c,i)=>[c[0],c[1],`${i+1} h`]);break;}}}
 content=`<div class="sheet-bar"></div><header class="sheet-head"><strong>${title}</strong><button class="icon-button" data-action="close-modal" aria-label="Fechar">${icon('close')}</button></header><div class="sheet-scroll">${comments.map((c,i)=>`<div class="comment"><span class="avatar">${['🧑','👩','🧒','🙂'][i%4]}</span><div><strong>${esc(c[0])}</strong><p>${esc(c[1])}</p><small>${c[2]||'há pouco'}</small></div></div>`).join('')}<p class="small muted" style="margin-top:12px">Comentários criados para a simulação. Eles não comprovam qualidade, estoque ou popularidade.</p></div>`;
 }else if(v.type==='more'){content=`<div class="sheet-bar"></div><header class="sheet-head"><strong>Sobre o conteúdo</strong><button class="icon-button" data-action="close-modal">${icon('close')}</button></header><div class="sheet-scroll"><p class="small">Você pode ver anúncios, publicações de amigos e parcerias comerciais. O selo “Patrocinado” identifica anúncios pagos.</p><button class="secondary" data-action="close-modal" style="width:100%">Voltar à publicação</button></div>`;
 }else if(v.type==='search'){content=`<div class="sheet-bar"></div><header class="sheet-head"><strong>Explorar</strong><button class="icon-button" data-action="close-modal">${icon('close')}</button></header><div class="sheet-scroll"><p class="small muted">A aba Explorar está limitada neste capítulo, como acontece em uma demonstração de rede social. Você pode visitar os stories, ler os comentários e entrar nas lojas.</p></div>`;
 }
 const box=document.createElement('div');box.className='layer-backdrop';box.innerHTML=`<section class="bottom-sheet" role="dialog" aria-modal="true">${content}</section>`;phone.appendChild(box);
}
function drawStory(){const phone=document.querySelector('.phone');if(!phone)return;document.querySelector('.story-layer')?.remove();const ph=phases[state.phase],s=ph.stories[story.index],el=document.createElement('div');el.className='story-layer';el.innerHTML=`<div class="story-top"><span class="avatar photo-avatar"><img class="avatar-photo" src="${mediaSrc(s.photo)}" alt=""/></span><span class="story-user">${s.user} · 12 h</span><span class="story-type">${s.source==='page'?'página':'amigo'}</span><button class="story-close" data-action="close-story" aria-label="Fechar story">${icon('close')}</button></div><div class="story-picture" data-action="close-story">${art(s.art,false,'',s.photo)}</div><div class="story-caption" data-action="close-story">${s.text}</div><div style="position:absolute;bottom:26px;left:30px;right:30px;font-size:12px;color:#e6d5eb;text-align:center">Toque para voltar ao feed</div>`;phone.appendChild(el);
}
function toast(msg){const phone=document.querySelector('.phone');if(!phone)return;clearTimeout(toastTimer);phone.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;phone.appendChild(t);toastTimer=setTimeout(()=>t.remove(),2700);}
function openProduct(id){if(!products[id])return;if(!state.viewed.includes(id)){state.viewed.push(id);pushEvent('view',`Visitou a loja de ${products[id].name}`);}signal(id,2);save();overlay={type:'product',id};modal=null;drawOverlay();}
function closeOverlay(){const refresh=overlay?.type==='profile';overlay=null;document.querySelector('.layer')?.remove();if(refresh)renderGame(true);}
function openComments(post){if(post.startsWith('ad-')){const id=post.replace(/^ad-(main|ret)-/,'');if(!state.reviews.includes(id)){state.reviews.push(id);pushEvent('comments',`Leu avaliações de ${products[id].name}`);signal(id,1);save();}}modal={type:'comments',post};drawModal();}
function closeModal(){modal=null;document.querySelector('.layer-backdrop')?.remove();}
function addToCart(id){if(!state.cart.includes(id)){state.cart.push(id);signal(id,3);pushEvent('cart',`Salvou ${products[id].name} no carrinho`);}save();renderGame(true);toast(`${products[id].name} salvo no carrinho. Você pode voltar quando quiser.`);}
function buy(id,throughDecision=false){const p=products[id];if(!p)return;const extra=id==='plano'&&state.extraChecked?9.90:0;const cost=p.price+extra;if(state.wallet<cost){toast('Seu saldo fictício não é suficiente para esta compra.');return false;}if(state.purchases.some(x=>x.id===id)){toast('Você já comprou esse produto neste jogo.');return false;}state.wallet=Math.round((state.wallet-cost)*100)/100;state.purchases.push({id,cost,phase:state.phase,extra,at:Date.now()});if(id==='plano')state.monthly=cost;state.cart=state.cart.filter(x=>x!==id);signal(id,2);pushEvent('buy',`Comprou ${p.name}${extra?' com adicional VIP':''} por ${money(cost)}`);save();if(throughDecision){advance('buy');}else if(phases[state.phase]?.id===id){closeOverlay();advance('buy');}else{closeOverlay();renderGame(true);toast('Compra simulada concluída. O restante do feed continua.');}return true;}
function doDecision(type){const id=phases[state.phase].id;if(type==='buy'){if(id==='plano'){openProduct(id);toast('Confira os detalhes e os adicionais antes de assinar.');return;}buy(id,true);return;}if(type==='cart'){if(!state.cart.includes(id)){state.cart.push(id);signal(id,3);pushEvent('cart',`Salvou ${products[id].name} no carrinho`);}}if(type==='skip')pushEvent('skip',`Decidiu não comprar ${products[id].name} naquele momento`);advance(type);}
function advance(type){state.decisions[state.phase]=type;state.phase++;overlay=null;modal=null;story=null;save();if(state.phase>=phases.length){renderEnd();return;}const ph=phases[state.phase],dynamic=state.cart.length?`Você tem ${state.cart.length} item(ns) no carrinho. Isso pode mudar os anúncios.`:'Os anúncios podem mudar conforme o que você visitou.';root.innerHTML=`<main class="transition"><div class="transition-box"><div class="scene-icon">${ph.emoji}</div><div class="eyebrow" style="color:#dfb0d8">UM NOVO MOMENTO</div><h2>${ph.name}.</h2><p>${dynamic}</p><div class="scene-progress"><i class="current"></i><i></i><i></i></div><button class="scene-next" data-action="open-next">Voltar ao feed →</button></div></main>`;clearTimeout(introTimer);introTimer=setTimeout(()=>renderGame(),1600);}
function renderEnd(){const purchases=state.purchases.map(p=>products[p.id].name);const goalOk=state.wallet>=state.goal;const decisionCopy={buy:'Comprou',cart:'Guardou no carrinho',skip:'Preferiu não comprar'};const lines=phases.map((ph,i)=>{const choice=state.decisions[i]||'skip',p=products[ph.id];return `<div class="event-row"><span>${ph.emoji}</span><div><strong>${p.name}</strong><p>${decisionCopy[choice]} naquele momento${state.purchases.some(x=>x.id===ph.id&&x.phase!==i)?' · adquirido mais tarde':''}</p></div><strong style="font-size:11px;color:#88798b">${choice==='buy'?money((state.purchases.find(x=>x.id===ph.id)||{cost:p.price}).cost):'—'}</strong></div>`;}).join('');
 const insightList=[];
 if(state.stories.length)insightList.push(['FOMO e pertencimento','Stories de amigos criam contexto social: a vontade de acompanhar o grupo pode influenciar o que parece necessário.']);
 if(state.reviews.length)insightList.push(['Prova social','Você consultou comentários. Avaliações ajudam, mas sua seleção e destaque também podem direcionar o julgamento.']);
 if(state.viewed.length||state.cart.length)insightList.push(['Personalização e retargeting','A visita às lojas e os itens salvos alimentaram novos anúncios. Atenção não é o mesmo que intenção de compra.']);
 if(state.decisions[1])insightList.push(['Influenciadores e escassez','O tênis apareceu com parceria comercial e alegações de estoque limitado. Popularidade e urgência não comprovam necessidade.']);
 if(state.decisions[3])insightList.push(['Preço de referência e urgência','Um preço anterior riscado e a frase “só hoje” podem aumentar a sensação de oportunidade, mesmo sem comparação independente.']);
 if(state.purchases.some(x=>x.id==='plano'))insightList.push(['Arquitetura de escolha','A assinatura tinha um adicional pré-selecionado. Vale conferir complementos e cobranças recorrentes antes de confirmar.']);
 if(!insightList.length)insightList.push(['Atenção e escolha','Você passou por anúncios em diferentes contextos. A publicidade tenta conquistar atenção, mas a resposta depende da pessoa e da situação.']);
 root.innerHTML=`<main class="end"><div class="end-inner"><div class="brandline"><span class="brand-symbol">↗</span> POR TRÁS DA OFERTA</div><div class="eyebrow" style="margin-top:23px">FIM DA SIMULAÇÃO</div><h1>Você saiu do feed.<br><span style="color:#b57bbb">E levou o quê?</span></h1><p class="end-lead">Não existe um “perfil de consumista” aqui. O interessante é observar como anúncios, amigos e escolhas de interface participaram das suas decisões.</p><div class="status-chip">${goalOk?'✓ Objetivo de economia preservado':'↗ Objetivo de economia não atingido neste cenário'}</div><div class="end-grid"><div class="end-stat"><label>Saldo fictício final</label><strong>${money(state.wallet)}</strong><span class="small muted">Você começou com ${money(620)}</span></div><div class="end-stat"><label>Queria guardar</label><strong>${money(state.goal)}</strong><span class="small muted">${goalOk?`Reserva ainda possível`:`Faltam ${money(state.goal-state.wallet)}`}</span></div><div class="end-stat"><label>Compras realizadas</label><strong>${state.purchases.length}</strong><span class="small muted">${state.purchases.length?money(620-state.wallet)+' gastos':'Nenhuma compra concluída'}</span></div><div class="end-stat"><label>Compromisso mensal</label><strong>${money(state.monthly)}</strong><span class="small muted">${state.monthly?'Plano de renovação automática':'Nenhuma assinatura contratada'}</span></div></div><div class="end-box"><h3>Suas decisões</h3>${lines}${state.cart.length?`<p class="small muted" style="margin-top:12px">Ainda no carrinho: ${state.cart.map(id=>products[id].name).join(', ')}.</p>`:''}</div><div class="end-box"><h3>O que aconteceu por trás das ofertas?</h3>${insightList.map(([h,p])=>`<div class="insight"><strong>${h}</strong><p>${p}</p></div>`).join('')}</div><div class="end-box"><h3>Para refletir</h3><p style="font-size:14px;color:#6f6271;line-height:1.75;margin-bottom:0">Uma compra pode ser necessária, útil ou desejada — e isso não é automaticamente um problema. A questão da pesquisa é como determinadas estratégias podem <strong>estimular decisões menos refletidas</strong> dependendo do orçamento, do contexto, das emoções e da autonomia de cada pessoa.</p></div><div class="end-buttons"><button class="primary" data-action="restart">Jogar novamente ↗</button><button class="secondary" data-action="sources">Ver a base do relatório</button></div><div id="sources" hidden class="end-box tiny-sources"><strong>Base teórica do relatório do projeto</strong><p>Bauman (2008), <em>Vida para consumo</em> · Iyer et al. (2020), <em>Impulse buying: a meta-analytic review</em> · Setyani et al. (2019), anúncios personalizados · Huang et al. (2025), prova social · Shamim, Azam e Islam (2024), influenciadores · Feng et al. (2024), escassez · OECD (2022), <em>Dark commercial patterns</em>.</p><p>Conceitos extraídos do documento do projeto “O poder do marketing digital: estratégias psicológicas e consumismo”, introdução e problema de partida. O jogo representa situações fictícias; não é um experimento científico nem mede causalidade ou personalidade.</p></div><p class="end-disclaimer">Este é um protótipo educativo com marcas, pessoas, preços, stories e anúncios fictícios. Ele não realiza transações. A simulação não diagnostica hábitos nem trata todas as compras como consumismo.</p></div></main>`;}
function restart(){state=makeInitial();save();overlay=null;modal=null;story=null;renderHome();}
function render(){if(!state.started){renderHome();return;}if(state.phase>=phases.length){renderEnd();return;}renderGame();}
root.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');if(!el){if(e.target.classList.contains('layer-backdrop'))closeModal();else if(e.target.classList.contains('story-layer')){story=null;document.querySelector('.story-layer')?.remove();}return;}
 const a=el.dataset.action,id=el.dataset.product,post=el.dataset.post;
 if(a==='start'){state.started=true;save();showIntro(0)}
 else if(a==='skip-intro'||a==='open-next'){clearTimeout(introTimer);renderGame()}
 else if(a==='intro-next'){clearTimeout(introTimer);if(scene<2)showIntro(scene+1);else renderGame()}
 else if(a==='story'){const index=Number(el.dataset.index),sid=`s${state.phase}-${index}`,storyRef=phases[state.phase].stories[index];if(!state.stories.includes(sid)){state.stories.push(sid);signal(storyRef.product,1);pushEvent('story',`Viu o story de ${storyRef.user}`);}story={index};drawStory();}
 else if(a==='close-story'){story=null;document.querySelector('.story-layer')?.remove();}
 else if(a==='like'){const index=state.liked.indexOf(post);if(index<0){state.liked.push(post);if(state.phase===1)signal('tenis',1);if(state.phase===2)signal('plano',1);}else state.liked.splice(index,1);save();renderGame(true);}
 else if(a==='bookmark'){const idx=state.bookmarks.indexOf(post);if(idx<0)state.bookmarks.push(post);else state.bookmarks.splice(idx,1);save();renderGame(true);}
 else if(a==='like-ad'){signal(id,1);save();toast('Interesse registrado pelo algoritmo fictício.');}
 else if(a==='comments')openComments(post)
 else if(a==='product')openProduct(id)
 else if(a==='close-modal')closeModal()
 else if(a==='post-more'||a==='ad-more'){modal={type:'more'};drawModal();}
 else if(a==='close-overlay')closeOverlay()
 else if(a==='cart'){overlay={type:'cart'};drawOverlay();}
 else if(a==='profile'){overlay={type:'profile'};drawOverlay();}
 else if(a==='notifications'){overlay={type:'notifications'};drawOverlay();}
 else if(a==='search'){modal={type:'search'};drawModal();}
 else if(a==='share')toast('Compartilhamento indisponível nesta demonstração.')
 else if(a==='feedtop'){document.querySelector('#feed-scroll')?.scrollTo({top:0,behavior:'smooth'});}
 else if(a==='scroll-cue'){document.querySelector('#feed-scroll')?.scrollBy({top:340,behavior:'smooth'});}
 else if(a==='add-cart'){addToCart(id);}
 else if(a==='remove-cart'){state.cart=state.cart.filter(x=>x!==id);save();renderGame(true);overlay={type:'cart'};drawOverlay();}
 else if(a==='buy')buy(id)
 else if(a==='decision')doDecision(el.dataset.decision)
 else if(a==='restart')restart()
 else if(a==='sources'){const n=document.querySelector('#sources');n.hidden=!n.hidden;if(!n.hidden)n.scrollIntoView({block:'nearest',behavior:'smooth'});}
});
root.addEventListener('change',e=>{if(e.target?.id==='vip-extra'){state.extraChecked=e.target.checked;save();const b=document.querySelector('.product-foot button[data-action=buy]');if(b)b.textContent='Assinar · '+money(products.plano.price+(state.extraChecked?9.90:0))+'/mês';}if(e.target?.id==='privacy-switch'){state.personalized=e.target.checked;save();toast(state.personalized?'Personalização ativada.':'Personalização desativada nesta simulação.');}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(story){story=null;document.querySelector('.story-layer')?.remove();}else if(modal)closeModal();else if(overlay)closeOverlay();}});
render();
})();
</script>
</body>
</html>
